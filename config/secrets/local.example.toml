# Local secrets and deployment-specific sensitive values.
# File location: config/secrets/local.toml
# Replace `your_bot` with the real account name. If the account contains dots or spaces, quote it manually.

[feishu.your_bot]
app_id = "cli_xxx"
app_secret = "your_app_secret"
encrypt_key = "your_encrypt_key"
verification_token = "your_verification_token"
bot_open_id = ""

[feishu.your_bot.codex]
api_key = "sk-xxxx"
# Custom codex base_url values must support a WebSocket upgrade on /v1/responses.
base_url = "https://api.openai.com/v1"

[sync.default]
provider = "webdav"

[sync.default.webdav]
url = "https://dav.example.com/remote.php/dav/files/your-user"
username = "your-user"
password = "your-password"
base_path = "/SunCodexClaw/backups"

[sync.your_bot]
# Optional override. If omitted, workspace_id defaults to the bot account name.
workspace_id = "your_bot"
